<html lang="en">
<head>
<meta charset="utf-8">

<title>Mindbranch</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23eef2e9'/><path d='M16 27V14M16 14L9 8M16 14l7-6' stroke='%232f6b4f' stroke-width='2' fill='none' stroke-linecap='round'/><circle cx='9' cy='6' r='2.6' fill='%238a6a15'/><circle cx='23' cy='6' r='2.6' fill='%232f6b4f'/></svg>">
</head>
<body>

<!-- ===================================================================
     The living background. Five layers, back to front:

       .bg      base wash + five drifting colour blobs (multiply)
       .canopy  tiled branching texture, swaying, with sap climbing the
                trunks and junction nodes breathing inside the <pattern>
       .vine    two climbing vines, left and right, each with a light
                travelling up it and leaves that open in sequence
       .motes   rising pollen
       .leaves  falling leaves, each with its own size, spin and drift

     Everything animates transform or opacity only, so nothing reflows.
     =================================================================== -->

<div class="bg" aria-hidden="true">
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  <span class="blob b4"></span><span class="blob b5"></span>
</div>

<!-- No viewBox on purpose: one user unit stays one CSS pixel, so the canopy
     tiles at a constant size on a phone and a desktop alike. -->
<svg class="canopy" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="tw" width="440" height="380" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#6f9179" stroke-linecap="round">
        <g stroke-width="1.5" opacity=".40">
          <path d="M120 380 L120 244"/><path d="M330 380 L330 282"/>
        </g>
        <g stroke-width="1.1" opacity=".34">
          <path d="M120 244 L68 178 M120 244 L184 172 M120 244 L122 190"/>
          <path d="M330 282 L286 230 M330 282 L380 224 M330 282 L332 240"/>
        </g>
        <g stroke-width=".8" opacity=".27">
          <path d="M68 178 L36 120 M68 178 L88 126"/>
          <path d="M184 172 L228 118 M184 172 L164 124"/>
          <path d="M122 190 L100 154 M122 190 L146 152"/>
          <path d="M286 230 L256 186 M286 230 L302 188"/>
          <path d="M380 224 L414 178 M380 224 L364 180"/>
          <path d="M440 130 L410 84 M0 130 L30 84"/>
        </g>
      </g>
      <g fill="#5f8368" class="node">
        <circle cx="120" cy="244" r="2.6"/><circle cx="330" cy="282" r="2.4"/>
      </g>
      <g fill="#5f8368" class="node n2">
        <circle cx="68" cy="178" r="1.9"/><circle cx="184" cy="172" r="1.9"/>
        <circle cx="286" cy="230" r="1.7"/><circle cx="380" cy="224" r="1.7"/>
      </g>
      <g fill="none" stroke="#3f8f66" stroke-width="1.7" stroke-linecap="round" opacity=".5">
        <path class="sap" d="M120 380 L120 244 L184 172 L228 118"/>
        <path class="sap s2" d="M330 380 L330 282 L286 230 L256 186"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#tw)"/>
</svg>

<svg class="vine vl" viewBox="0 0 260 1200" preserveAspectRatio="xMinYMid meet" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#5f8368" stroke-linecap="round">
    <path class="stem" d="M46 1210 C 104 1052 12 946 66 796 C 120 646 24 552 78 402 C 132 252 36 158 90 -10" stroke-width="3.4" opacity=".44"/>
    <path class="stem glow" d="M46 1210 C 104 1052 12 946 66 796 C 120 646 24 552 78 402 C 132 252 36 158 90 -10" stroke-width="4" opacity=".85" stroke-dasharray="90 1900"/>
    <g stroke-width="1.6" opacity=".46">
      <path d="M84 1104 C 128 1082 150 1044 148 1006"/><path d="M32 992 C -6 968 -18 928 -6 894"/>
      <path d="M96 852 C 142 832 164 794 160 756"/><path d="M40 700 C 2 676 -10 636 2 602"/>
      <path d="M104 566 C 150 546 172 508 168 470"/><path d="M50 404 C 12 380 0 340 12 306"/>
      <path d="M112 260 C 158 240 180 202 176 164"/>
    </g>
  </g>
  <g class="vleaf" fill="#6f9179" opacity=".5">
    <ellipse cx="148" cy="1000" rx="19" ry="9" transform="rotate(-28 148 1000)"/>
    <ellipse cx="-6" cy="890" rx="17" ry="8" transform="rotate(26 -6 890)"/>
    <ellipse cx="160" cy="750" rx="20" ry="9.5" transform="rotate(-32 160 750)"/>
    <ellipse cx="2" cy="598" rx="16" ry="7.5" transform="rotate(24 2 598)"/>
    <ellipse cx="168" cy="464" rx="19" ry="9" transform="rotate(-26 168 464)"/>
    <ellipse cx="12" cy="302" rx="15" ry="7" transform="rotate(30 12 302)"/>
    <ellipse cx="176" cy="158" rx="18" ry="8.5" transform="rotate(-30 176 158)"/>
  </g>
</svg>

<svg class="vine vr" viewBox="0 0 260 1200" preserveAspectRatio="xMaxYMid meet" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#5f8368" stroke-linecap="round">
    <path class="stem" d="M214 1210 C 156 1044 248 940 194 790 C 140 640 236 546 182 396 C 128 246 224 152 170 -10" stroke-width="3.4" opacity=".44"/>
    <path class="stem glow g2" d="M214 1210 C 156 1044 248 940 194 790 C 140 640 236 546 182 396 C 128 246 224 152 170 -10" stroke-width="4" opacity=".85" stroke-dasharray="90 1900"/>
    <g stroke-width="1.6" opacity=".46">
      <path d="M176 1096 C 132 1074 110 1036 112 998"/><path d="M228 984 C 266 960 278 920 266 886"/>
      <path d="M164 844 C 118 824 96 786 100 748"/><path d="M220 692 C 258 668 270 628 258 594"/>
      <path d="M156 558 C 110 538 88 500 92 462"/><path d="M210 396 C 248 372 260 332 248 298"/>
      <path d="M148 252 C 102 232 80 194 84 156"/>
    </g>
  </g>
  <g class="vleaf v2" fill="#6f9179" opacity=".5">
    <ellipse cx="112" cy="992" rx="19" ry="9" transform="rotate(28 112 992)"/>
    <ellipse cx="266" cy="882" rx="17" ry="8" transform="rotate(-26 266 882)"/>
    <ellipse cx="100" cy="742" rx="20" ry="9.5" transform="rotate(32 100 742)"/>
    <ellipse cx="258" cy="590" rx="16" ry="7.5" transform="rotate(-24 258 590)"/>
    <ellipse cx="92" cy="456" rx="19" ry="9" transform="rotate(26 92 456)"/>
    <ellipse cx="248" cy="294" rx="15" ry="7" transform="rotate(-30 248 294)"/>
    <ellipse cx="84" cy="150" rx="18" ry="8.5" transform="rotate(30 84 150)"/>
  </g>
</svg>

<div class="motes" id="motes" aria-hidden="true"></div>
<div class="leaves" id="leaves" aria-hidden="true"></div>

<div class="wrap">
  <header class="top">
    <h1>Mind<span>branch</span></h1>
    <div class="sub">DSM-5-TR criteria logic, walked one question at a time</div>
    <div class="spacer"></div>
    <button class="btn ghost sm" id="restart">Start screen</button>
  </header>
  <nav class="branch-tabs" role="tablist" aria-label="Diagnostic branches">
    <button type="button" class="branch-tab" id="mindbranch-tab" data-workspace-tab="mindbranch" role="tab" aria-selected="true" aria-controls="app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 22V11L5 5m7 6 7-6M12 15l-7-2m7 4 7-3"/><circle cx="5" cy="4" r="2"/><circle cx="19" cy="4" r="2"/></svg>Mindbranch</button>
    <button type="button" class="branch-tab" id="bodybranch-tab" data-workspace-tab="bodybranch" role="tab" aria-selected="false" aria-controls="body-app" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="4" r="2.5"/><path d="M8 8h8l3 7-2 1-3-5v11m-4-11v11m-2-14-3 7 2 1 3-5M10 16h4"/></svg>Bodybranch</button>
  </nav>
  <main id="app" role="tabpanel" aria-labelledby="mindbranch-tab"></main>
  <main id="body-app" role="tabpanel" aria-labelledby="bodybranch-tab" hidden></main>
</div>

<script>
/* Motes and leaves are generated rather than hand-written so their count can
   scale with the viewport: twenty of each on a phone would be a snowstorm. */
(function () {
  var rnd = function (a, b) { return a + Math.random() * (b - a); };

  var motes = document.getElementById('motes');
  var nm = Math.max(10, Math.min(24, Math.round(window.innerWidth / 78)));
  for (var i = 0; i < nm; i++) {
    var m = document.createElement('span');
    var s = rnd(2, 5.6);
    m.className = 'mote';
    m.style.left = rnd(0, 100).toFixed(2) + '%';
    m.style.width = m.style.height = s.toFixed(1) + 'px';
    m.style.animationDuration = rnd(24, 62).toFixed(1) + 's';
    m.style.animationDelay = '-' + rnd(0, 60).toFixed(1) + 's';
    m.style.setProperty('--sway', rnd(-80, 80).toFixed(0) + 'px');
    m.style.opacity = rnd(.35, 1).toFixed(2);
    motes.appendChild(m);
  }

  /* Three leaf silhouettes so the fall never looks like one asset repeated. */
  var SHAPES = [
    'M12 0C4.6 5.4 0 12.6 0 19.2 0 26.2 5.2 31.6 12 34 18.8 31.6 24 26.2 24 19.2 24 12.6 19.4 5.4 12 0Z',
    'M13 0C3 7 0 16 2 24c1.6 6.4 7 10 11 10 6 0 11-6 11-14C24 12 20 5 13 0Z',
    'M12 1C6 8 1 15 1 21c0 8 6 13 11 13s11-5 11-13c0-6-5-13-11-20Z'
  ];
  var TINTS = ['#7ba586', '#8fb07a', '#a8b06a', '#6f9179', '#c0a85e'];
  var leaves = document.getElementById('leaves');
  var nl = Math.max(7, Math.min(16, Math.round(window.innerWidth / 115)));
  for (var j = 0; j < nl; j++) {
    var w = rnd(11, 26);
    var el = document.createElement('span');
    el.className = 'leaf';
    el.style.left = rnd(-4, 100).toFixed(2) + '%';
    el.style.width = w.toFixed(1) + 'px';
    el.style.animationDuration = rnd(19, 46).toFixed(1) + 's';
    el.style.animationDelay = '-' + rnd(0, 46).toFixed(1) + 's';
    el.style.setProperty('--sx', rnd(-160, 160).toFixed(0) + 'px');
    el.style.setProperty('--spin', rnd(320, 900).toFixed(0) + 'deg');
    el.style.setProperty('--tilt', rnd(-40, 40).toFixed(0) + 'deg');
    el.innerHTML = '<svg viewBox="0 0 24 34" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="' + SHAPES[j % SHAPES.length] + '" fill="' + TINTS[j % TINTS.length] + '"/>' +
      '<path d="M12 2 L12 32" stroke="rgba(255,255,255,.45)" stroke-width="1" fill="none"/></svg>';
    leaves.appendChild(el);
  }
})();
</script>

</body>
